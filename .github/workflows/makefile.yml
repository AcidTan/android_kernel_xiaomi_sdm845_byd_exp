# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 新增：更新CA证书和同步系统时间
      - name: Fix SSL Certificates & Time Sync
        run: |
          sudo apt-get update -y
          sudo apt-get install --reinstall -y ca-certificates
          sudo update-ca-certificates --fresh
          sudo timedatectl set-ntp true
          echo "当前系统时间：$(date)"

      # 原始的编译步骤（保持不变）
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/AcidTan/android_kernel_xiaomi_sdm845_byd_exp
          kernel-dir: msm-4.9
          kernel-branch: KernelSU-Next
          config: sdm845-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          ksu-version: main
          android-version: 10
          aosp-clang-version: r353983c
          disable-lto: true
          anykernel3: true
