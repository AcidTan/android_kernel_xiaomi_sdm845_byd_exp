# A simple action usage
jobs:
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 新增：更新CA证书和系统时间
      - name: Fix SSL Certificates & Time Sync
        run: |
          # 1. 更新apt源，确保获取最新的证书包
          sudo apt-get update -y
          
          # 2. 重新安装ca-certificates（覆盖旧证书）
          sudo apt-get install --reinstall -y ca-certificates
          
          # 3. 强制刷新系统信任的证书列表（关键步骤）
          sudo update-ca-certificates --fresh
          
          # 4. 同步系统时间（避免时间错误导致证书"过期"误判）
          sudo timedatectl set-ntp true
          echo "当前系统时间：$(date)"  # 验证时间是否正常
        
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/AcidTan/android_kernel_xiaomi_sdm845_byd_exp
          kernel-dir: msm-4.9
          kernel-branch: KernelSU-Next
          config: sdm845_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          ksu-version: main
          android-version: 10
          aosp-clang-version: r353983c
          disable-lto: true
          anykernel3: true
