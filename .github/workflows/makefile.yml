# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fix SSL Certificates & Time Sync
        run: |
          # 安装 hwclock 依赖
          sudo apt-get update -y
          sudo apt-get install -y util-linux
          
          # 更新证书
          sudo apt-get install --reinstall -y ca-certificates
          sudo update-ca-certificates --fresh
          sudo curl -k https://curl.se/ca/cacert.pem -o /etc/ssl/certs/ca-certificates.crt
          
          # 同步时间
          sudo timedatectl set-ntp true
          sudo hwclock --systohc
          echo "当前系统时间：$(date)"

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y make gcc clang flex bison libssl-dev bc libelf-dev dwarves git

      - name: Fix Kconfig wireguard path
        run: |
          kconfig_path="$GITHUB_WORKSPACE/msm-4.9/net/Kconfig"
          echo "修改前第86行："
          sed -n '86p' "$kconfig_path"
          sed -i '86s|net/wireguard/Kconfig|wireguard/Kconfig|' "$kconfig_path"
          echo "修改后第86行："
          sed -n '86p' "$kconfig_path"

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/AcidTan/android_kernel_xiaomi_sdm845_byd_exp
          kernel-dir: msm-4.9
          kernel-branch: KernelSU-Next
          config: sdm845_defconfig
          arch: arm64
          aosp-gcc: false
          aosp-clang: true
          ksu: true
          ksu-version: main
          android-version: 10
          aosp-clang-version: r353983c
          disable-lto: true
          anykernel3: true
